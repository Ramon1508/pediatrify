<mat-toolbar class="app-navbar">
  <div class="nav-center" (click)="goHome()" style="cursor: pointer;">
    <img ngSrc="images/Logo.jpg" alt="Logo" class="nav-logo" width="40" height="40" priority />
    <span class="nav-brand">{{ brandName }}</span>
  </div>

  <div class="nav-right">
    @if (authService.isAuthenticated) {
      <div class="notification-actions">
        <app-notification-bell />
        <button mat-icon-button (click)="openProfileDialog()" aria-label="Perfil">
          <mat-icon>account_circle</mat-icon>
        </button>
      </div>
    }
  </div>
</mat-toolbar>
