<mat-toolbar class="app-navbar">
  <a class="nav-center" [routerLink]="homeRoute()" aria-label="Ir al inicio">
    <img [src]="logoUrl()" [alt]="'Logo de ' + brandName" class="nav-logo" width="40" height="40" />
    <span class="nav-brand">{{ brandName }}</span>
  </a>

  <div class="nav-right">
    @if (authService.isAuthenticated) {
      <div class="notification-actions">
        <app-notification-bell />
        <button mat-icon-button [class.active]="profileActive()" (click)="openProfileDialog()" aria-label="Perfil">
          <mat-icon>account_circle</mat-icon>
        </button>
      </div>
    }
  </div>
</mat-toolbar>
