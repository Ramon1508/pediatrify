<div class="detail-card">
  <h3 class="detail-title">{{ appointment().patientName }}</h3>

  @if (appointment().notes) {
    <p class="detail-label">Motivo de la consulta:</p>
    <p class="detail-value">{{ appointment().notes }}</p>
  }

  <div class="detail-actions">
    <button mat-button class="btn-tertiary btn-detail" (click)="onReagendar()">Reagendar</button>
    <button mat-stroked-button class="btn-secondary btn-detail" (click)="onCancelar()">Cancelar</button>
    <button mat-unelevated-button class="btn-primary btn-detail" (click)="onVerHistorial()">Ver historial</button>
  </div>
</div>
