<h2 class="dialog-title">{{ data.title }}</h2>

<div class="dialog-content">
  <p>{{ data.message }}</p>
</div>

<div class="dialog-actions">
  <button mat-button class="btn-tertiary dialog-btn" [mat-dialog-close]="false">
    {{ data.cancelText || 'Cancelar' }}
  </button>
  <button mat-unelevated-button class="btn-primary" [mat-dialog-close]="true">
    {{ data.confirmText || 'Aceptar' }}
  </button>
</div>
