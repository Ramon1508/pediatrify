<h2 class="confirm-title">{{ data.title }}</h2>

<p class="confirm-message">{{ data.message }}</p>

<div class="confirm-actions">
  <button mat-button class="btn-tertiary dialog-btn" (click)="close()">{{ data.cancelLabel || 'Cerrar' }}</button>
  <button mat-unelevated-button [class]="data.confirmButtonClass || 'btn-primary dialog-btn'" (click)="confirm()">{{ data.confirmLabel || 'Confirmar' }}</button>
</div>
