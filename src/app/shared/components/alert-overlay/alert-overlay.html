<div class="alerts-wrapper" [class.panel-alerts]="inRightPanel()">
  @for (alert of alertService.alerts(); track alert.id) {
    <div class="alert-box" [class.alert-success]="alert.type === 'success'" [class.alert-error]="alert.type === 'error'" [class.alert-warning]="alert.type === 'warning'" @fadeSlide>
      <div class="alert-content">
        @if (alert.title) {
          <span class="alert-title">{{ alert.title }}</span>
        }
        <span class="alert-message">{{ alert.message }}</span>
      </div>
      <button class="alert-close" (click)="alertService.dismiss(alert.id)">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  }
</div>
