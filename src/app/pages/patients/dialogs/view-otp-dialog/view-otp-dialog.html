<h2 class="dialog-title">Contrase&ntilde;a de acceso</h2>

<div class="dialog-content">
  <div class="otp-patient-name">{{ patientFullName() }}</div>

  @if (loading()) {
    <p role="status">Consultando el acceso del paciente…</p>
  } @else if (loadFailed()) {
    <p role="alert">No fue posible consultar el acceso del paciente.</p>
    <button mat-button class="btn-tertiary" (click)="load()">Reintentar</button>
  } @else {
    <div class="otp-display">
      <span class="otp-label">Contrase&ntilde;a actual:</span>
      <div class="otp-value-row">
        <span class="otp-value">{{ password() }}</span>
        <button mat-icon-button class="otp-copy-btn" aria-label="Copiar contraseña de acceso"
                [disabled]="!password() || copying()" (click)="copyOtp()">
          <mat-icon>content_copy</mat-icon>
        </button>
      </div>
    </div>
  }
</div>

<div class="dialog-actions">
  <button mat-button class="btn-tertiary dialog-btn" (click)="close()">Cerrar</button>
</div>
