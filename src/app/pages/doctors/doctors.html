<div class="doctors-container">
  <div class="header-actions">
    <span class="page-title">{{ pageTitle }}</span>
    <button mat-unelevated-button class="btn-primary" (click)="openNewDoctor()">
      <mat-icon>add</mat-icon>
      {{ addLabel }}
    </button>
  </div>

  @if (loading()) {
    <mat-progress-bar mode="indeterminate" />
  }

  @if (doctors().length === 0 && !loading()) {
    <div class="empty-state-wrapper">
      <div class="empty-state-content">
        <span class="empty-text">{{ emptyLabel }}</span>
        <button mat-unelevated-button class="btn-primary" (click)="openNewDoctor()">
          <mat-icon>add</mat-icon>
          {{ addLabel }}
        </button>
      </div>
    </div>
  } @else {
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Buscar por nombre</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input matInput [formControl]="searchControl" />
    </mat-form-field>

    <div class="doctors-grid">
      @for (doctor of filteredDoctors(); track doctor.uid) {
        <mat-card class="doctor-card" [class.empty]="filteredDoctors().length === 0">
          <div class="card-header">
            <span class="title-large card-name" [matTooltip]="doctor.name">{{ doctor.name }}</span>
            <button mat-icon-button [matMenuTriggerFor]="doctorMenu" class="card-menu-btn">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #doctorMenu="matMenu">
              <button mat-menu-item (click)="openEditDoctor(doctor)">
                <mat-icon>edit</mat-icon>
                <span>{{ editLabel }}</span>
              </button>
              @if (!doctor.profileComplete) {
                <button mat-menu-item (click)="resendInvitation(doctor)">
                  <mat-icon>email</mat-icon>
                  <span>Reenviar invitaci&oacute;n</span>
                </button>
              }
              <button mat-menu-item (click)="deleteDoctor(doctor)">
                <mat-icon>delete</mat-icon>
                <span>{{ deleteLabel }}</span>
              </button>
            </mat-menu>
          </div>
          <div class="card-body">
            <span class="card-label">Correo:</span>
            <span class="card-email">{{ doctor.email }}</span>
          </div>
        </mat-card>
      }
    </div>
  }
</div>
