<h2 class="delete-title">{{ title() }}</h2>

<p class="delete-subtitle">
  {{ confirmationMessage() }}
</p>

<div class="delete-actions">
  <button mat-button class="btn-tertiary dialog-btn" [disabled]="saving()" (click)="close()">Cancelar</button>
  <button mat-unelevated-button class="btn-danger dialog-btn" [disabled]="cannotConfirm()" (click)="confirm()">
    {{ confirmLabel() }}
  </button>
</div>
