<h2 class="delete-title">{{ title }}</h2>

<p class="delete-subtitle">Al eliminar un {{ subjectLabel }}, éste perderá acceso a la plataforma.</p>

<div class="delete-actions">
  <button mat-stroked-button class="btn-tertiary dialog-btn" [mat-dialog-close]="false">Cancelar</button>
  <button mat-unelevated-button class="btn-danger dialog-btn" (click)="confirm()">{{ confirmLabel }}</button>
</div>
