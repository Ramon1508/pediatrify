<h2 class="cancel-title">Cancelar consulta</h2>

<p class="cancel-subtitle">
  Al cancelar una consulta el padre o tutor del paciente recibirá una notificación de la cancelación y podrá seleccionar un nuevo día y horario para la consulta si así lo desea.
</p>

<div class="cancel-actions">
  <button mat-button class="btn-tertiary" (click)="close()">Cerrar</button>
  <button mat-unelevated-button class="btn-danger" (click)="confirm()">Cancelar consulta</button>
</div>
